<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Italy Academy - أكاديمية إيطاليا</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #333;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #008C45; margin-bottom: 10px; } /* لون علم إيطاليا الأخضر */
        p { color: #666; margin-bottom: 30px; }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .btn {
            display: block;
            padding: 15px;
            text-decoration: none;
            color: white;
            border-radius: 10px;
            font-weight: bold;
            transition: transform 0.2s, background 0.3s;
        }
        /* تعديل الرابط ليفتح فهرس القواعد */
        .btn-grammatica { background-color: #008C45; }
        .btn-conversazione { background-color: #CD212A; } /* لون علم إيطاليا الأحمر */
        .btn-vocabulary { background-color: #000; }
        
        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.8em;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Italy Academy 🇮🇹</h1>
        <p>مرحباً بك في طريقك لإتقان الإيطالية</p>

        <div class="menu-grid">
            <a href="Grammatica/README.md" class="btn btn-grammatica">Grammatica - القواعد</a>
            
            <a href="#" class="btn btn-conversazione">Conversazioni - المحادثات</a>
            
            <a href="#" class="btn btn-vocabulary">Vocabolario - الكلمات</a>
        </div>

        <div class="footer">
            Sviluppato con ❤️ per imparare l'italiano
        </div>
    </div>

</body>
</html>
