<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>I Nomi - الأسماء</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; background-color: #f4f4f4; text-align: right; direction: rtl; }
        .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #008C45; text-align: center; }
        .ita { font-weight: bold; color: #CD212A; direction: ltr; display: inline-block; }
    </style>
</head>
<body>
    <h1>I Nomi (الأسماء في الإيطالي)</h1>
    <div class="box">
        <p>الأسماء في الإيطالي مذكر ومؤنث. النهاية هي اللي بتعرفك النوع:</p>
        <ul>
            <li>المفرد المذكر بينتهي بـ <span class="ita">O</span> زي <span class="ita">Ragazzo</span> (ولد).</li>
            <li>المفرد المؤنث بينتهي بـ <span class="ita">A</span> زي <span class="ita">Ragazza</span> (بنت).</li>
        </ul>
    </div>
</body>
</html>
