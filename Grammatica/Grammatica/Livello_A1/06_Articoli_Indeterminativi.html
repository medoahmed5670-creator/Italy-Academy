        <h1>🇮🇹 الدرس السادس: أدوات النكرة</h1>
        <p>بنستخدمها لما نكون بنتكلم عن حاجة مش محددة (واحد/واحدة).</p>
        <ul>
            <li><strong>Un</strong>: للمذكر (Un libro)</li>
            <li><strong>Uno</strong>: للمذكر اللي بيبدأ بـ s+حرف ساكن أو z (Uno zaino)</li>
            <li><strong>Una</strong>: للمؤنث (Una casa)</li>
            <li><strong>Un'</strong>: للمؤنث اللي بيبدأ بحرف متحرك (Un'amica)</li>
        </ul>
