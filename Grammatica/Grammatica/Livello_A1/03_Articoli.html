<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gli Articoli - أدوات التعريف</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: right; direction: rtl; }
        h1 { color: #008C45; text-align: center; }
        .ita { font-weight: bold; color: #CD212A; direction: ltr; display: inline-block; }
    </style>
</head>
<body>
    <h1>Gli Articoli Determinativi (أدوات التعريف)</h1>
    <p>بالمصري يعني "الـ":</p>
    <ul>
        <li>مذكر ساكن: <span class="ita">Il</span> (زي <span class="ita">Il libro</span>).</li>
        <li>مؤنث ساكن: <span class="ita">La</span> (زي <span class="ita">La casa</span>).</li>
        <li>مذكر/مؤنث بيبدأ بمتحرك: <span class="ita">L'</span> (زي <span class="ita">L'amico</span>).</li>
    </ul>
</body>
</html>
